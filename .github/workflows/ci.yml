name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Install Chromium
        run: python -m playwright install --with-deps chromium
      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - name: Install web dependencies
        working-directory: apps/web
        run: npm ci
      - name: Generate API types
        working-directory: apps/web
        run: npm run gen:api && git diff --exit-code -- src/api/api.d.ts
      - name: Web type check
        working-directory: apps/web
        run: npm run typecheck
      - name: Web lint
        working-directory: apps/web
        run: npm run lint
      - name: Web tests
        working-directory: apps/web
        run: npm run test
      - name: Web build
        working-directory: apps/web
        run: npm run build
      - name: Lint
        run: ruff check .
      - name: Type check
        run: mypy domains shared tool_gateway connectors apps workflows notification_gateway infra
      - name: Boundary check
        run: python3 scripts/check_boundaries.py
      - name: Sensitive scan
        run: python3 scripts/scan_sensitive.py
      - name: Prepare audited Linux test dependencies
        run: |
          docker pull pgvector/pgvector:pg16
          python - <<'PY'
          import docker
          from infra.pilot.resources import PILOT_MINIO_IMAGE
          from tests.integration.quote_evidence_linux_support import (
              PYTHON_IMAGE, bootstrap_dependency_image, audited_dependency_image_id,
          )
          client = docker.from_env()
          try:
              client.images.pull(PILOT_MINIO_IMAGE)
              client.images.pull(PYTHON_IMAGE, platform="linux/arm64")
          finally:
              client.close()
          bootstrap_dependency_image()
          print(audited_dependency_image_id())
          PY
      - name: Tests
        run: pytest -q -m "not e2e"
      - name: Enterprise isolation acceptance
        run: python -m tests.run_tenant_isolation
      - name: Browser E2E
        env:
          TRADEOS_REQUIRE_E2E: "1"
        run: pytest tests/e2e -q -W error
