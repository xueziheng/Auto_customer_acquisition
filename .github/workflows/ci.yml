name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Install enterprise knowledge parser dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends bubblewrap poppler-utils
          test -x /usr/bin/bwrap
          test -x /usr/bin/pdftoppm
          test -d /proc
      - name: Permit bwrap namespaces on the ephemeral CI runner
        run: |
          # Ubuntu 24.04 的 restrictuserns 会禁止未授权 bwrap 配置隔离网络的 loopback。
          # 只允许固定 bwrap 可执行文件建立自己的沙箱，不关闭全局 AppArmor/userns 限制。
          sudo apt-get install -y --no-install-recommends apparmor
          sudo tee /etc/apparmor.d/tradeos-ci-bwrap > /dev/null <<'APPARMOR'
          abi <abi/4.0>,
          include <tunables/global>

          profile tradeos-ci-bwrap /usr/bin/bwrap flags=(unconfined) {
            userns,
          }
          APPARMOR
          sudo apparmor_parser -r /etc/apparmor.d/tradeos-ci-bwrap
      - name: Verify enterprise knowledge sandbox startup
        run: |
          python - <<'PY'
          import json
          import platform
          import subprocess
          from pathlib import Path
          from connectors.files.knowledge import KnowledgeFileParser

          # 仅运行固定合成诊断，不读取环境、上传原件或 Provider 凭证。
          print("sandbox_host", json.dumps({
              "machine": platform.machine(),
              "system_python": str(Path("/usr/bin/python3").resolve()),
              "apparmor_userns": Path("/proc/sys/kernel/apparmor_restrict_unprivileged_userns").read_text().strip()
                  if Path("/proc/sys/kernel/apparmor_restrict_unprivileged_userns").is_file() else "unavailable",
              "userns_max": Path("/proc/sys/user/max_user_namespaces").read_text().strip()
                  if Path("/proc/sys/user/max_user_namespaces").is_file() else "unavailable",
          }), flush=True)
          parser = KnowledgeFileParser(
              python_binary=Path("/usr/bin/python3"),
              bwrap_binary=Path("/usr/bin/bwrap"),
          )
          probes = (
              ("system_runtime", "text/plain",
               "import json, socket, sys, xml.etree.ElementTree; print(json.dumps({'python': sys.version.split()[0]}))"),
              ("visual_runtime", "application/pdf",
               "import sys; sys.path.insert(0, '/parser-libs'); import pypdf; from PIL import Image, _imaging; print('visual_runtime_ready')"),
          )
          for name, mime, source in probes:
              command = parser._command(mime)
              assert command[-4:] == ["/usr/bin/python3", "-I", "-B", "/parser.py"]
              command = command[:-1] + ["-c", source]
              result = subprocess.run(
                  command, capture_output=True, text=True, timeout=15,
                  env={"PATH": "/usr/bin", "LANG": "C.UTF-8"}, check=False,
              )
              print(name, json.dumps({
                  "returncode": result.returncode,
                  "stdout": result.stdout[:4096],
                  "stderr": result.stderr[:4096],
              }), flush=True)
              if result.returncode:
                  raise SystemExit("企业资料真实沙箱启动检查失败")
          PY
      - name: Install Chromium
        run: python -m playwright install --with-deps chromium
      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - name: Install web dependencies
        working-directory: apps/web
        run: npm ci
      - name: Generate API types
        working-directory: apps/web
        run: npm run gen:api
      - name: Upload generated API contracts
        uses: actions/upload-artifact@v7.0.2
        with:
          name: tradeos-api-types
          path: |
            apps/web/src/api/api.d.ts
            apps/web/src/api/platform-api.d.ts
          retention-days: 3
      - name: Web type check
        working-directory: apps/web
        run: npm run typecheck
      - name: Web lint
        working-directory: apps/web
        run: npm run lint
      - name: Web tests
        working-directory: apps/web
        run: npm run test
      - name: Web build
        working-directory: apps/web
        run: npm run build
      - name: Upload production web build
        uses: actions/upload-artifact@v7.0.2
        with:
          name: tradeos-web-dist
          path: apps/web/dist
          retention-days: 3
      - name: Lint
        run: ruff check .
      - name: Type check
        run: mypy domains shared tool_gateway connectors apps workflows notification_gateway infra
      - name: Boundary check
        run: python3 scripts/check_boundaries.py
      - name: Sensitive scan
        run: python3 scripts/scan_sensitive.py
      - name: Unit tests
        run: pytest -q -m "not e2e" --ignore=tests/integration --ignore=tests/e2e --durations=15
      - name: Verify committed API contracts
        run: git diff --exit-code -- apps/web/src/api/api.d.ts apps/web/src/api/platform-api.d.ts

  integration:
    needs: checks
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3]
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Install Chromium
        run: python -m playwright install --with-deps chromium
      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - name: Install web dependencies
        working-directory: apps/web
        run: npm ci
      - name: Web build
        working-directory: apps/web
        run: npm run build
      - name: Prepare audited Linux test dependencies
        run: |
          docker pull pgvector/pgvector:pg16
          python - <<'PY'
          import docker
          from infra.pilot.resources import PILOT_MINIO_IMAGE
          from tests.integration.quote_evidence_linux_support import (
              PYTHON_IMAGE, bootstrap_dependency_image, audited_dependency_image_id,
          )
          client = docker.from_env()
          try:
              client.images.pull(PILOT_MINIO_IMAGE)
              client.images.pull(PYTHON_IMAGE, platform="linux/arm64")
          finally:
              client.close()
          bootstrap_dependency_image()
          print(audited_dependency_image_id())
          PY
      - name: Integration tests
        env:
          SHARD: ${{ matrix.shard }}
        run: |
          python - <<'PY'
          import os
          import subprocess
          import sys
          from pathlib import Path
          shard = int(os.environ["SHARD"])
          assert 0 <= shard < 4
          files = sorted(str(path) for path in Path("tests/integration").rglob("test_*.py"))
          selected = files[shard::4]
          assert selected
          print(f"integration_shard={shard};files={len(selected)}", flush=True)
          raise SystemExit(subprocess.call([
              sys.executable, "-m", "pytest", "-q", "-m", "not e2e",
              "--durations=15", *selected,
          ]))
          PY

  acceptance:
    needs: checks
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Install Chromium
        run: python -m playwright install --with-deps chromium
      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - name: Install web dependencies
        working-directory: apps/web
        run: npm ci
      - name: Web build
        working-directory: apps/web
        run: npm run build
      - name: Prepare audited Linux test dependencies
        run: |
          docker pull pgvector/pgvector:pg16
          python - <<'PY'
          import docker
          from infra.pilot.resources import PILOT_MINIO_IMAGE
          from tests.integration.quote_evidence_linux_support import (
              PYTHON_IMAGE, bootstrap_dependency_image, audited_dependency_image_id,
          )
          client = docker.from_env()
          try:
              client.images.pull(PILOT_MINIO_IMAGE)
              client.images.pull(PYTHON_IMAGE, platform="linux/arm64")
          finally:
              client.close()
          bootstrap_dependency_image()
          print(audited_dependency_image_id())
          PY
      - name: Enterprise isolation acceptance
        run: python -m tests.run_tenant_isolation
      - name: Browser E2E
        env:
          TRADEOS_REQUIRE_E2E: "1"
        run: pytest tests/e2e -q -W error --durations=15

  ci:
    if: ${{ always() }}
    needs: [checks, integration, acceptance]
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 5
    steps:
      - name: Require every test group to pass
        env:
          REQUIRED_RESULTS: ${{ toJSON(needs) }}
        run: |
          python3 - <<'PY'
          import json
          import os
          results = json.loads(os.environ["REQUIRED_RESULTS"])
          if any(job["result"] != "success" for job in results.values()):
              raise SystemExit("必需检查尚未全部通过")
          print("全部必需检查通过")
          PY
