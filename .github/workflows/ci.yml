name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Lint
        run: ruff check .
      - name: Type check
        run: mypy domains shared tool_gateway apps workflows notification_gateway infra
      - name: Boundary check
        run: python3 scripts/check_boundaries.py
      - name: Sensitive scan
        run: python3 scripts/scan_sensitive.py
      - name: Tests
        run: pytest -q
