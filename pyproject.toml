[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tradeos-agent"
version = "0.1.0"
description = "以自主发现需求和客户为核心的跨境贸易智能操作系统"
requires-python = ">=3.12"
dependencies = [
    "fastapi",
    "uvicorn",
    "pydantic>=2",
    "sqlalchemy[asyncio]>=2.0.51,<2.1",
    "asyncpg",
    "alembic",
    "redis",
    "boto3",
    "docker>=7.1,<8",
    # macOS 7.2 的校时修正会使跨进程出生时间漂移；严格 PID 核验要求稳定内核值。
    "psutil==7.0.0; sys_platform == 'darwin'",
    "psutil>=7,<8; sys_platform != 'darwin'",
    "python-dotenv>=1.2.3",
    "openai",
    "dnspython==2.8.0",
    "tldextract==5.3.1",
    "reportlab==5.0.1",
    "pypdf==6.16.2",
    "Pillow==12.3.0",
    "PyYAML==6.0.3",
    "google-auth>=2,<3",
    "google-auth-oauthlib>=1,<2",
    "requests>=2,<3",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-asyncio",
    "testcontainers",
    "playwright",
    "ruff",
    "mypy==2.3.0",
    "types-PyYAML",
    "types-oauthlib==3.3.0.20260724",
    "aiosqlite",  # 内存 SQLite 测试夹具驱动；使 make check / CI 不依赖 Docker（HANDBOOK 允许「内存/容器数据库」）
    "httpx>=0.28,<0.29",  # FastAPI/ASGI API 合同测试使用 AsyncClient + ASGITransport
]

[tool.setuptools.packages.find]
where = ["."]
include = [
    "shared*",
    "domains*",
    "tool_gateway*",
    "notification_gateway*",
    "artifact_store*",
    "connectors*",
    "agent_runtime*",
    "workflows*",
    "apps*",
    "infra*",
]
exclude = ["tests*", "scripts*"]

[tool.ruff]
target-version = "py312"

[tool.ruff.lint]
# EXE002：可执行位无 shebang，属文件权限卫生而非代码质量；骨架期基线收敛（见 phase0 计划任务 1）。
ignore = ["EXE002"]

[tool.ruff.lint.per-file-ignores]
# 除 scripts/check_boundaries.py 外均为骨架 stub 豁免：首次实现对应文件
# （函数体不再是 NotImplementedError / `...`）时必须在同一 commit 删除其豁免。
# scripts/check_boundaries.py 的 FURB167 是既有真实脚本的一次性风格容忍，非 stub 豁免。
"agent_runtime/guardrails/rails.py" = ["F401"]
"connectors/base.py" = ["F401"]
"domains/conversations/models.py" = ["F401"]
"domains/outreach/models.py" = ["F401"]
"domains/outreach/schemas.py" = ["F401"]
"domains/sourcing/service.py" = ["F401", "I001"]
"tool_gateway/pipeline.py" = ["F401"]
"scripts/check_boundaries.py" = ["FURB167"]

[tool.mypy]
python_version = "3.12"
mypy_path = "typings"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = [
    "db: 需 Docker 后端的 Postgres 容器测试",
    "e2e: 真实 PostgreSQL、Uvicorn、Vite 与 Chromium 端到端测试",
]
