# Alembic 迁移配置（Phase 0 工程基建）
# 数据库 URL 不写死在这里：由 migrations/env.py 在运行时从根 .env 读取注入，
# 避免任何受跟踪文件携带机器路径或本地凭证。
[alembic]
script_location = migrations
prepend_sys_path = .
# path_separator = os
# sqlalchemy.url = driver://user:pass@localhost/dbname   # 运行时注入，见上

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
